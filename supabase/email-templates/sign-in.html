<h2>Your Family Tree sign-in</h2>
<p>Hi! Here's your link to sign in to the family tree:</p>
<p><a href="{{ .ConfirmationURL }}">Open the family tree</a></p>
<p>Or, if the app asks for a code, enter: <strong style="font-size:20px;letter-spacing:2px">{{ .Token }}</strong></p>
<p>This link and code work once and expire in an hour.</p>
<p style="color:#776e61;font-size:13px">If you didn't ask to sign in, you can ignore this email. Nobody can get in without it.</p>
